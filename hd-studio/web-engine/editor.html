<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD Studio | Editor</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f5f2;color:#222}header{padding:18px 24px;background:#222;color:white}main{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;padding:20px}form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #aaa;border-radius:6px;background:white;color:#222}button{cursor:pointer}button.primary{background:#222;color:white}iframe{width:100%;height:78vh;border:1px solid #ccc;background:white}#status{min-height:24px} .actions{display:flex;flex-wrap:wrap;gap:8px}small{font-weight:400}@media(max-width:760px){main{grid-template-columns:1fr}iframe{height:65vh}}</style></head><body><header><strong>HD STUDIO / WEB EDITOR</strong> · v0.3</header><main><form id="editor"><label>Empresa<input name="name" required></label><label>Categoria<input name="eyebrow" required></label><label>Título<input name="headline" required></label><label>Descrição<textarea name="description" required></textarea></label><label>Serviços (título | descrição, um por linha)<textarea name="services" rows="5" required></textarea></label><label>Texto do botão<input name="cta" required></label><label>WhatsApp (DDI + DDD + número)<input name="phone" inputmode="numeric"></label><label><span><input type="checkbox" name="verified"> Confirmei o número</span></label><label>Fundo<input name="background" type="color"></label><label>Texto<input name="foreground" type="color"></label><label>Destaque<input name="accent" type="color"></label><label>Texto do destaque<input name="onAccent" type="color"></label><label>Composição<select name="layout"><option value="split">Dividida</option><option value="centered">Centralizada</option></select></label><label>Tipografia<select name="type"><option value="serif">Serifada</option><option value="sans">Sem serifa</option></select></label><div class="actions"><button type="button" id="example">Alternar exemplo</button><button type="submit" class="primary">Atualizar prévia</button><button type="button" id="export">Exportar HTML</button><button type="button" id="json">Exportar JSON</button></div><p id="status" role="status"></p><small>Prévia não oficial. Dados ficam nesta sessão; não há envio, publicação ou armazenamento remoto.</small></form><section><iframe title="Prévia do site" sandbox=""></iframe></section></main><script type="module" src="./editor.mjs"></script></body></html>
